<body class="bg-background h-full antialiased text-on-background flex flex-col">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface flex items-center px-margin-mobile h-14 justify-between" style="border:none;">
<button aria-label="Go back" class="hover:bg-secondary-container/50 dark:hover:bg-tertiary-container/50 rounded-full transition-colors active:scale-95 transition-transform duration-150 p-sm text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim flex-grow text-center pr-10">
            Boutika
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
<div class="w-full max-w-md">
<!-- Headline & Subtext -->
<div class="mb-xl text-center md:text-left">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-sm">
                    Enter your mobile number
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    We'll send you a secure code to log in or create your account.
                </p>
</div>
<!-- Phone Input Form -->
<form class="space-y-xl w-full" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface block" for="phone-number">Mobile Number</label>
<div class="relative flex items-center group">
<!-- Country Code Picker (Stylized) -->
<div class="absolute left-0 inset-y-0 flex items-center">
<select aria-label="Country Code" class="h-full py-0 pl-md pr-lg border-transparent bg-transparent text-on-surface font-body-md text-body-md focus:ring-0 focus:border-transparent z-10 appearance-none cursor-pointer">
<option>+1</option>
<option>+44</option>
<option>+91</option>
</select>
<span class="material-symbols-outlined absolute right-2 text-outline text-[16px] pointer-events-none group-focus-within:text-primary">expand_more</span>
</div>
<!-- Vertical Divider -->
<div class="absolute left-20 h-3/5 w-px bg-outline-variant"></div>
<!-- Phone Number Input -->
<input autocomplete="tel" class="w-full pl-24 pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200 outline-none h-12" id="phone-number" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-outline mt-xs">Message and data rates may apply.</p>
</div>
<!-- Continue Button -->
<button class="w-full bg-primary-container text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-tertiary-container active:scale-[0.98] transition-all duration-200 flex justify-center items-center h-12 shadow-sm" type="submit">
                    Continue
                </button>
</form>
</div>
</main>
