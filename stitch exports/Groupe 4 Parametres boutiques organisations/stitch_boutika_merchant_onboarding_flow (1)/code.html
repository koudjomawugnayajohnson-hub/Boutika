<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header (Transactional, no shell nav logic required per prompt/context, just a basic back header) -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline w-full top-0 sticky flex justify-between items-center px-margin-mobile h-16 z-10 shadow-sm">
<button aria-label="Go back" class="flex items-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 p-2 rounded-full -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 transform -translate-x-1/2">RetailCore Pro</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col p-margin-mobile pt-lg w-full max-w-md mx-auto">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs">Add New Shop</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter the details for the new retail location.</p>
</div>
<form class="flex flex-col gap-lg flex-grow bg-surface-container-lowest p-lg rounded-xl border border-outline-variant shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.05)]">
<!-- Shop Name -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="shopName">Shop Name *</label>
<input class="w-full h-12 px-md border border-outline-variant rounded bg-surface-bright text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow transition-colors" id="shopName" name="shopName" placeholder="e.g. Downtown Flagship" required="" type="text"/>
</div>
<!-- Address -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="address">Address *</label>
<input class="w-full h-12 px-md border border-outline-variant rounded bg-surface-bright text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow transition-colors" id="address" name="address" placeholder="123 Main St" required="" type="text"/>
</div>
<div class="flex gap-md w-full">
<!-- City -->
<div class="flex flex-col gap-sm flex-1">
<label class="font-label-sm text-label-sm text-on-surface" for="city">City *</label>
<input class="w-full h-12 px-md border border-outline-variant rounded bg-surface-bright text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow transition-colors" id="city" name="city" placeholder="Seattle" required="" type="text"/>
</div>
<!-- Region/Sector -->
<div class="flex flex-col gap-sm flex-1">
<label class="font-label-sm text-label-sm text-on-surface" for="region">Region/Sector</label>
<div class="relative">
<select class="w-full h-12 px-md pr-10 appearance-none border border-outline-variant rounded bg-surface-bright text-on-surface font-body-md focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow transition-colors" id="region" name="region">
<option disabled="" selected="" value="">Select region</option>
<option value="north">North Sector</option>
<option value="south">South Sector</option>
<option value="east">East Sector</option>
<option value="west">West Sector</option>
<option value="central">Central District</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Optional: Manager Contact -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="contact">Manager Contact (Optional)</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">person</span>
<input class="w-full h-12 pl-[44px] pr-md border border-outline-variant rounded bg-surface-bright text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow transition-colors" id="contact" name="contact" placeholder="Name or Phone" type="text"/>
</div>
</div>
<div class="mt-auto pt-lg flex flex-col gap-md">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-md text-label-md rounded flex items-center justify-center gap-xs hover:bg-tertiary-container active:scale-[0.98] transition-all duration-150 shadow-sm" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                    Save Shop
                </button>
<button class="w-full h-12 bg-transparent border border-outline-variant text-primary-container font-label-md text-label-md rounded flex items-center justify-center hover:bg-surface-container-low active:scale-[0.98] transition-all duration-150" type="button">
                    Cancel
                </button>
</div>
</form>
</main>
</body></html>
