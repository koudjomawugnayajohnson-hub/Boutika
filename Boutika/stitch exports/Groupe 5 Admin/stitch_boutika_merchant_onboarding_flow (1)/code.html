<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invite Team Member - Boutika</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f0f3ff",
                        "on-tertiary-container": "#bbcae0",
                        "surface-bright": "#f9f9ff",
                        "outline": "#75777d",
                        "on-secondary-fixed-variant": "#444749",
                        "surface-variant": "#d8e3fb",
                        "on-surface": "#111c2d",
                        "on-primary-container": "#bbcae1",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#d4e4fa",
                        "tertiary-container": "#475568",
                        "on-surface-variant": "#44474c",
                        "secondary-fixed": "#e1e2e4",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#3a485b",
                        "secondary-container": "#dee0e2",
                        "tertiary": "#303e50",
                        "secondary-fixed-dim": "#c5c6c8",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#191c1e",
                        "on-secondary": "#ffffff",
                        "background": "#f9f9ff",
                        "on-primary-fixed": "#0d1c2e",
                        "surface": "#f9f9ff",
                        "error": "#ba1a1a",
                        "outline-variant": "#c4c6cd",
                        "inverse-surface": "#263143",
                        "surface-container-high": "#dee8ff",
                        "surface-container": "#e7eeff",
                        "inverse-primary": "#b9c7df",
                        "surface-dim": "#cfdaf2",
                        "secondary": "#5c5f60",
                        "on-secondary-container": "#606365",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#b9c8de",
                        "surface-tint": "#515f74",
                        "on-background": "#111c2d",
                        "on-tertiary-fixed-variant": "#39485a",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#d8e3fb",
                        "primary-fixed": "#d5e3fc",
                        "on-tertiary-fixed": "#0d1c2d",
                        "primary-container": "#475569",
                        "inverse-on-surface": "#ecf1ff",
                        "error-container": "#ffdad6",
                        "primary": "#303e51",
                        "primary-fixed-dim": "#b9c7df"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "unit": "4px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter": "24px",
                        "container-max": "1440px",
                        "xl": "40px",
                        "margin-desktop": "32px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-xl": ["IBM Plex Sans"],
                        "headline-lg": ["IBM Plex Sans"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["IBM Plex Sans"],
                        "mono-label": ["IBM Plex Sans"],
                        "headline-md": ["IBM Plex Sans"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "mono-label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #f9f9ff; }
        .role-radio:checked + div {
            border-color: #475569;
            background-color: #f0f3ff;
        }
        .role-radio:checked + div .radio-indicator {
            background-color: #475569;
            border-color: #475569;
        }
        .role-radio:focus-visible + div {
            outline: 2px solid #475569;
            outline-offset: 2px;
        }
        
        .custom-checkbox:checked {
            background-color: #475569;
            border-color: #475569;
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 4px;
            height: 8px;
            border-bottom: 2px solid white;
            border-right: 2px solid white;
            margin-top: -2px;
        }

        /* Modal Overlay Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        #modal-overlay {
            animation: fadeIn 0.2s ease-out forwards;
        }
        #invite-modal {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen font-body-md text-on-surface antialiased bg-surface flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm z-40 flex items-center justify-center p-4" id="modal-overlay">
<!-- Invite Modal -->
<div class="bg-surface-container-lowest w-full max-w-[600px] rounded-lg border border-outline-variant shadow-lg flex flex-col relative z-50" id="invite-modal">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest rounded-t-lg">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Invite Team Member</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit">Add a new user to your Boutika workspace.</p>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:bg-surface-container p-unit rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Form Content -->
<div class="p-lg flex flex-col gap-lg overflow-y-auto max-h-[70vh]">
<!-- Personal Info Section -->
<div class="flex flex-col gap-md">
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="firstName">First Name</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition-all placeholder:text-outline" id="firstName" placeholder="e.g. Jane" type="text"/>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="lastName">Last Name</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition-all placeholder:text-outline" id="lastName" placeholder="e.g. Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-sm text-body-sm focus:border-primary focus:ring-2 focus:ring-primary/10 outline-none transition-all placeholder:text-outline" id="email" placeholder="jane.doe@example.com" type="email"/>
</div>
</div>
<!-- Divider -->
<hr class="border-outline-variant"/>
<!-- Role Selection -->
<div class="flex flex-col gap-md">
<div>
<h3 class="font-label-md text-label-md text-on-surface">Role &amp; Permissions</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit">Select the access level for this user.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Role: Admin -->
<label class="relative cursor-pointer group">
<input class="sr-only role-radio" name="role" onchange="toggleShopAssignment(this.value)" type="radio" value="admin"/>
<div class="border border-outline-variant rounded-lg p-md transition-all hover:bg-surface-container-low flex items-start gap-sm h-full">
<div class="radio-indicator w-4 h-4 rounded-full border border-outline-variant mt-1 flex-shrink-0 transition-colors"></div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface flex items-center gap-unit">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
                                        Admin
                                    </span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-unit">Full access to all stores, settings, and billing.</span>
</div>
</div>
</label>
<!-- Role: Staff -->
<label class="relative cursor-pointer group">
<input checked="" class="sr-only role-radio" name="role" onchange="toggleShopAssignment(this.value)" type="radio" value="staff"/>
<div class="border border-outline-variant rounded-lg p-md transition-all hover:bg-surface-container-low flex items-start gap-sm h-full">
<div class="radio-indicator w-4 h-4 rounded-full border border-outline-variant mt-1 flex-shrink-0 transition-colors"></div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface flex items-center gap-unit">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 0;">storefront</span>
                                        Staff
                                    </span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-unit">Limited access to assigned shops for day-to-day tasks.</span>
</div>
</div>
</label>
</div>
</div>
<!-- Shop Assignment (Conditional) -->
<div class="flex flex-col gap-md bg-surface-container-low rounded-lg p-md border border-outline-variant transition-opacity duration-300" id="shop-assignment-section">
<div>
<h4 class="font-label-md text-label-md text-on-surface">Assign Shops</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit">Select which locations this staff member can access.</p>
</div>
<div class="flex flex-col gap-sm">
<!-- Shop Item -->
<label class="flex items-center gap-sm p-sm hover:bg-surface-container rounded cursor-pointer transition-colors group">
<div class="relative flex items-center">
<input class="custom-checkbox appearance-none w-4 h-4 border border-outline-variant rounded-sm bg-surface-container-lowest checked:bg-primary-container checked:border-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20" type="checkbox"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface flex-grow">Downtown Flagship</span>
<span class="material-symbols-outlined text-outline text-[16px] group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">location_on</span>
</label>
<!-- Shop Item -->
<label class="flex items-center gap-sm p-sm hover:bg-surface-container rounded cursor-pointer transition-colors group">
<div class="relative flex items-center">
<input checked="" class="custom-checkbox appearance-none w-4 h-4 border border-outline-variant rounded-sm bg-surface-container-lowest checked:bg-primary-container checked:border-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20" type="checkbox"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface flex-grow">Online Store</span>
<span class="material-symbols-outlined text-outline text-[16px] group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">language</span>
</label>
<!-- Shop Item -->
<label class="flex items-center gap-sm p-sm hover:bg-surface-container rounded cursor-pointer transition-colors group">
<div class="relative flex items-center">
<input class="custom-checkbox appearance-none w-4 h-4 border border-outline-variant rounded-sm bg-surface-container-lowest checked:bg-primary-container checked:border-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20" type="checkbox"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface flex-grow">Eastside Warehouse</span>
<span class="material-symbols-outlined text-outline text-[16px] group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">warehouse</span>
</label>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-bright rounded-b-lg flex justify-end gap-md items-center">
<button class="font-label-md text-label-md text-primary-container bg-transparent border border-outline-variant hover:bg-surface-container hover:border-outline transition-colors px-md py-sm rounded h-10 focus:outline-none focus:ring-2 focus:ring-primary/20" type="button">
                    Cancel
                </button>
<button class="font-label-md text-label-md text-on-primary bg-primary-container hover:bg-tertiary transition-colors px-lg py-sm rounded h-10 flex items-center gap-sm focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-sm hover:shadow" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">send</span>
                    Send Invite
                </button>
</div>
</div>
</div>
<script>
        function toggleShopAssignment(role) {
            const section = document.getElementById('shop-assignment-section');
            if (role === 'staff') {
                section.style.display = 'flex';
                // Small delay to allow display to apply before fading in
                setTimeout(() => {
                    section.style.opacity = '1';
                }, 10);
            } else {
                section.style.opacity = '0';
                setTimeout(() => {
                    section.style.display = 'none';
                }, 300); // match transition duration
            }
        }
    </script>
</body></html>
