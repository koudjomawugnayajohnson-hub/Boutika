<body class="bg-surface-container-lowest min-h-screen flex flex-col font-body-md text-on-surface antialiased">

<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center pt-xl px-margin-mobile">

</div>
<!-- OTP Input Form -->

<div class="flex justify-between gap-2 md:gap-xs mb-lg">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md rounded bg-surface-container-lowest border border-outline-variant text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>

<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md rounded bg-surface-container-lowest border border-outline-variant text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md rounded bg-surface-container-lowest border border-outline-variant text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md rounded bg-surface-container-lowest border border-outline-variant text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md rounded bg-surface-container-lowest border border-outline-variant text-on-surface transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>

                        Resend code
                    </button>
</div>

                    Verify &amp; Continue
                </button>
</form>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otp-form');

            // Focus first input on load
            if (inputs.length > 0) {
                setTimeout(() => inputs[0].focus(), 100);
            }

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Ensure only one digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    // Move to next input if filled
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Move back on backspace if empty
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Prevent non-numeric pasting
                input.addEventListener('paste', (e) => {
                     e.preventDefault();
                     const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, inputs.length);
                     if(pastedData) {
                         pastedData.split('').forEach((char, i) => {
                             if(inputs[index + i]) {
                                 inputs[index + i].value = char;
                                 if(index + i < inputs.length - 1) {
                                     inputs[index + i + 1].focus();
                                 } else {
                                     inputs[index + i].blur();
                                 }
                             }
                         });
                     }
                });
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                // Add loading state logic here if needed
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1000);
            });
        });
    </script>
